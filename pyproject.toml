[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ttsim-mcp"
version = "0.1.0"
description = "MCP server giving Claude access to Tabletop Simulator via the External Editor API"
requires-python = ">=3.11"
dependencies = ["mcp>=2.3,<3", "pillow>=10", "pypdf>=5"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "anyio>=4"]

[tool.setuptools.packages.find]
include = ["ttsim_mcp*"]

[tool.setuptools.package-data]
ttsim_mcp = ["lua/*.lua"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not ttsim'"
markers = ["ttsim: requires Tabletop Simulator running with a game loaded"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
